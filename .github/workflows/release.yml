name: Release

on:
    push:
        tags: ['*']

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - uses: ncipollo/release-action@v1
              with:
                  artifacts: 'dist/Engine*'
